  attention_check: "为保证问卷质量，本题请选择特定选项"
  long_term_memory: "你是否希望 AI 管家记住你的个人长期偏好？例如不吃辣、预算、人均消费、常去区域等"
  group_memory: "关于 AI 记录朋友 / 同事 / 小团体偏好，你更能接受哪种方式？"
