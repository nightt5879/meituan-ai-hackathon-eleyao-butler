school_work_status:
  status_column: "school_work_status"
  rule_column: "school_work_rule"
  labels:
    school: "在校"
    work: "已工作"
    excluded: "边界模糊-剔除"
    unclassified: "未分类"
  classifiable_statuses:
    - "在校"
    - "已工作"
  summary_order:
    - "在校"
    - "已工作"
    - "边界模糊-剔除"
    - "未分类"
  note: "该派生字段只用于在校/已工作对比；年龄段和总体统计仍使用全样本。"
  rules:
    - status: "在校"
      rule: "18-22 岁 + 专科/本科生"
      ages: ["18-22 岁"]
      identity_codes: ["A", "B"]
    - status: "在校"
      rule: "23-26 岁 + 研究生/博士生"
      ages: ["23-26 岁"]
      identity_codes: ["C", "D"]
    - status: "在校"
      rule: "27-30 岁 + 博士生"
      ages: ["27-30 岁"]
      identity_codes: ["D"]
    - status: "已工作"
      rule: "明确选择已工作 1-3 年/3 年以上"
      ages: ["18-22 岁", "23-26 岁", "27-30 岁", "30 岁以上"]
      identity_codes: ["E", "F"]
    - status: "已工作"
      rule: "27-30 岁/30 岁以上 + 专科/本科生/研究生，按学历回答推断为已工作"
      ages: ["27-30 岁", "30 岁以上"]
      identity_codes: ["A", "B", "C"]
    - status: "边界模糊-剔除"
      rule: "23-26 岁 + 专科/本科生"
      ages: ["23-26 岁"]
      identity_codes: ["A", "B"]
    - status: "边界模糊-剔除"
      rule: "30 岁以上 + 博士生"
      ages: ["30 岁以上"]
      identity_codes: ["D"]

