name: CI checks (manual)

# MANUAL ONLY. This workflow never runs automatically on push or pull_request,
# so it does not consume GitHub Actions minutes unless you explicitly trigger it
# from the Actions tab ("Run workflow"). With no Actions quota, run the exact
# same checks locally for free:
#
#     node scripts/ci-check.mjs        # repo-wide JS syntax guard + frontend typecheck
#     cd frontend && npm run build     # production build
#
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Syntax guard + typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Repo-wide JS syntax guard + frontend typecheck
        run: node scripts/ci-check.mjs
      - name: Frontend production build
        working-directory: frontend
        run: npm run build
