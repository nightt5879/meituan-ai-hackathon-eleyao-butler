name: CI checks

# Runs automatically for PRs targeting main and can still be started manually
# from the Actions tab ("Run workflow"). The same checks can be run locally:
#
#     node scripts/ci-check.mjs        # JS syntax guard + typecheck + unit tests
#     cd frontend && npm run build     # production build
#
on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: Syntax guard + typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Repo-wide JS syntax guard + frontend typecheck
        run: node scripts/ci-check.mjs
      - name: Frontend production build
        working-directory: frontend
        run: npm run build
