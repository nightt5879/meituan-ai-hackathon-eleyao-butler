name: Require closing issue

on:
  pull_request_target:
    types:
      - opened
      - edited
      - reopened
      - ready_for_review
      - synchronize

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  check:
    name: Check PR body
    runs-on: ubuntu-latest
    steps:
      - name: Require closing issue keyword
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = pr.body || "";
            const marker = "<!-- require-closing-issue -->";
            const closingIssuePattern = /\b(close[sd]?|fix(e[sd])?|resolve[sd]?)\s+(?:[\w.-]+\/[\w.-]+)?#\d+\b/i;
            const ok = closingIssuePattern.test(body);
            const { owner, repo } = context.repo;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: pr.number,
              per_page: 100
            });
            const existing = comments.find((comment) =>
              comment.user?.type === "Bot" && comment.body?.includes(marker)
            );

            if (ok) {
              if (existing) {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: existing.id,
                  body: [
                    marker,
                    "PR 关联 issue 检查已通过，当前描述里包含 closing issue 关键字。"
                  ].join("\n")
                });
              }
              return;
            }

            const message = [
              marker,
              "PR 描述缺少 closing issue 关键字。",
              "",
              "请在 PR 描述里加入类似：",
              "",
              "```md",
              "Closes #23",
              "```",
              "",
              "也可以使用 `Fixes #23` 或 `Resolves #23`。没有关联 issue 的 PR 暂不符合仓库提交规范。"
            ].join("\n");

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body: message
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pr.number,
                body: message
              });
            }

            core.setFailed("Missing closing issue keyword, e.g. Closes #23");
